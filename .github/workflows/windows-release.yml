name: Windows release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.305
      - name: Unit tests
        run: ./build.ps1 test -Configuration Release
      - name: Publish self-contained x64 application
        run: ./build.ps1 publish
      - name: Check application version
        run: |
          $exe = Join-Path $PWD 'dist/OpenRemoteAssistantWin.exe'
          $result = & $exe --version | Out-String
          if ($LASTEXITCODE -ne 0 -or $result -notmatch '0\.3\.0 \(build 18w\)') { throw "Version check failed: $result" }
          Write-Output $result
      - name: Build Inno Setup installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 was not found on this runner' }
          & $iscc installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify per-user install and uninstall
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'ora-install-check'
          $setup = Join-Path $PWD 'installer/installer/OpenRemoteAssistant-0.3.0-setup.exe'
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$target`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }
          try {
            $exe = Join-Path $target 'OpenRemoteAssistantWin.exe'
            if ((Get-FileHash $exe).Hash -ne (Get-FileHash 'dist/OpenRemoteAssistantWin.exe').Hash) { throw 'Installed executable differs' }
            foreach ($name in @('README.md', 'LICENSE', 'COPYRIGHT', 'THIRD_PARTY_NOTICES.md', 'licenses/WebView2-LICENSE.txt', 'docs/build-and-release.md', 'wwwroot/index.html')) {
              if (!(Test-Path (Join-Path $target $name))) { throw "Missing installed file: $name" }
            }
            $result = & $exe --version | Out-String
            if ($LASTEXITCODE -ne 0 -or $result -notmatch '0\.3\.0 \(build 18w\)') { throw "Installed version check failed: $result" }
          } finally {
            $p = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          }
          if (Test-Path (Join-Path $target 'OpenRemoteAssistantWin.exe')) { throw 'Executable remains after uninstall' }
      - name: Package and audit release files
        run: python scripts/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-0.3.0-build18w
          path: apps/windows/release/*
          if-no-files-found: error
          retention-days: 14
